<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D interactivo con Three.js</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Import Map para Three.js y sus módulos -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- Overlay UI para mostrar detalles de selección (Punto 11) -->
    <div id="ui-container">
        <h1>Visor 3D Interactivo</h1>
        <p id="info-text">Haz clic en un objeto para seleccionarlo</p>
        <div id="object-details" class="hidden">
            <span id="detail-tag">Objeto</span>
            <span id="detail-name">-</span>
        </div>
    </div>

    <!-- Script principal -->
    <script type="module" src="main.js"></script>
</body>
</html>
